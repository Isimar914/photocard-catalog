<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>XG Photocard Inventory</h1>
        <p>Admin Login</p>
    </header>

    <main>
        <section id="admin-login">
            <h2>Admin Login</h2>

            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" required>

                <button type="submit">Log In</button>
            </form>

            <p id="login-message"></p>
        </section>
        <section id="admin-dashboard" hidden>
            <h2>Admin Dashboard</h2>
            <p>Welcome! Manage your photocard inventory here.</p>

            <button id="logout-button">Log Out</button>

            <h3>Add Inventory Page</h3>
            <form id="add-page-form">
                <label for="member">Member</label>
                <select id="member" required>
                    <option value="">Select Member</option>
                    <option value="Jurin">Jurin</option>
                    <option value="Chisa">Chisa</option>
                    <option value="Hinata">Hinata</option>
                    <option value="Harvey">Harvey</option>
                    <option value="Juria">Juria</option>
                    <option value="Maya">Maya</option>
                    <option value="Cocona">Cocona</option>
                    <option value="Group">Group</option>
                </select>

                <label for="page-letter">Page Letter</label>
                <input type="text" id="page-letter" required>

                <label for="page-image">Binder Image</label>
                <input type="file" id="page-image" accept="image/*" required>

                <h4>Photocards</h4>

                <div id="new-cards"></div>

                <button type="button" id="add-card-button">
                    Add Card
                </button>

                <button type="submit">Save Inventory Page</button>
            </form>

            <h3> Manage Inventory</h3>
            <div id="admin-inventory"></div>
        </section>
    </main>
<script type="module" src="admin.js"></script>
</body>
</html>
