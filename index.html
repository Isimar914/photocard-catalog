<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XG Photocard Inventory</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>XG Photocard Inventory</h1>
    <p>Browse available XG photocards and check prices.</p>
  </header>

  <main>

    <section id="gallery">
      <h2>Photocard Gallery</h2>
      <p>Browse our collection of XG photocards below.</p>

      <div class="gallery-grid">

        <!-- Jurin inventory pagge A -->
        <div class="inventory-page">
            <h3>Jurin - Page A</h3>
            <img
                src="images/Jurin-a.png"
                alt="Jurin photocard inventory page A"
                class="photocard-sheet"
            >
        </div>

         <!-- Jurin inventory pagge B -->
        <div class="inventory-page">
            <h3>Jurin - Page B</h3>
            <img
                src="images/Jurin-b.png"
                alt="Jurin photocard inventory page B"
                class="photocard-sheet"
            >
        </div>

        </div>
    </section>

  </main>

  <footer>
    <p>XG Photocard Inventory</p>
  </footer>

</body>
</html>
