<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XG Photocard Inventory</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>XG Photocard Inventory</h1>
    <p>Browse available XG photocards and check prices.</p>
  </header>

  <main>

    <section id="gallery">
      <h2>Photocard Gallery</h2>
      <p>Browse our collection of XG photocards below.</p>

      <div class="status-key">
        <span class="available">&#9679; Available</span>
        <span class="sold">&#9679; Sold</span>
        <span class="not-for-sale">&#9679; Not for Sale</span>
      </div>

      <div class="gallery-grid" id="gallery-grid">
      </div>
    </section>

  </main>

  <footer>
    <p>XG Photocard Inventory</p>
  </footer>
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
